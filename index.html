<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBD STREAMING SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#120a0b;--line:#3a1114;--red:#e10600;--red2:#ff3b30;--tx:#f4f0f0;--mu:#a08f90;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Rajdhani","Segoe UI",Arial,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 50% -10%,#3a0608 0,transparent 55%)}
h1,h2,h3{font-family:"Orbitron","Rajdhani",Impact,sans-serif;margin:0;letter-spacing:.5px}
.logo{font-style:italic;font-weight:900;font-size:22px}.logo b{color:#fff}.logo span{color:var(--red2)}
input,textarea,select{width:100%;background:#0c0607;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px 12px;font:inherit;margin:4px 0 10px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red2);outline-offset:1px}
label{font-size:13px;color:var(--mu)}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;color:#fff;background:linear-gradient(180deg,var(--red2),var(--red));box-shadow:0 0 14px #e1060055}
button.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--tx)}
button.ok{background:#12803a;box-shadow:none}button.no{background:#4a1519;box-shadow:none}
button:disabled{opacity:.4;cursor:not-allowed}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.auth{max-width:380px;margin:8vh auto;background:var(--card);border:1px solid var(--red);border-radius:14px;padding:24px;box-shadow:0 0 30px #e1060044}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.tabs button{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:12px 16px;background:#0a0405}
.top .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bal{border:1px solid var(--red);border-radius:8px;padding:6px 12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card .p{font-size:22px;font-weight:800;color:var(--red2)}
.card small,.mu{color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:10px 0}
.row:last-child{border:0}
.tag{font-size:12px;border-radius:20px;padding:2px 10px;border:1px solid var(--line)}
.tag.pend{color:#ffb020;border-color:#ffb020}.tag.ok{color:#3ddc84;border-color:#3ddc84}.tag.no{color:var(--red2);border-color:var(--red2)}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
.box{background:#0e0708;border:1px solid var(--red);border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 0 40px #e1060066}
.box img{max-width:100%;border-radius:8px;margin:8px 0}
.cred{background:#000;border:1px dashed var(--red2);border-radius:8px;padding:12px;font-family:monospace;word-break:break-all;white-space:pre-wrap;margin:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--red);padding:10px 18px;border-radius:8px;display:none;z-index:60;font-weight:700}
.sec{margin-bottom:26px}.sec>h3{margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.hero{text-align:center;padding:56px 16px 36px;max-width:760px;margin:0 auto}
.hero h1{font-size:clamp(28px,6vw,48px);line-height:1.15;font-style:italic;text-shadow:0 0 28px #e1060088}
.hero h1 span{color:var(--red2)}
.hero p{color:var(--mu);font-size:17px;margin:14px 0 22px}
.hero .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 12px;max-width:760px}
.chips span{border:1px solid var(--red);border-radius:20px;padding:5px 14px;background:#1a0709;font-weight:700}
.steps{counter-reset:s}.steps .card::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:800}
.foot{text-align:center;color:var(--mu);padding:30px 16px 40px;border-top:1px solid var(--line)}
body{padding-bottom:48px}
.logo img{height:42px;max-width:220px;object-fit:contain;vertical-align:middle}
.pi{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px}
.wm{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--mu);background:#000b;border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer;z-index:40}
.wm:hover{color:#fff;border-color:var(--red)}
.qrb{position:relative;width:230px;max-width:100%;height:230px;margin:12px auto;border:2px solid var(--red);border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 0 22px #e1060055}
.qrb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.qrph{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px;color:#222;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/24px 24px}.qrph small{color:#666}
.ord{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:linear-gradient(180deg,#160a0c,#0e0708);flex-wrap:wrap}
.ord .av{width:46px;height:46px;font-size:19px}.ord .av.na{background:#2a1517;color:var(--mu)}
.ord .oi{flex:1;min-width:200px}.ord .cn{font-weight:700;font-size:16px}.oa{display:flex;gap:6px;flex-wrap:wrap}
body{font-family:"Inter","Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,.logo,.stats b{font-family:"Orbitron","Inter",sans-serif}
h3{font-family:"Inter",sans-serif;font-weight:700;letter-spacing:0;font-size:17px}
.logo{font-style:normal;font-weight:800;letter-spacing:1px}.hero h1{font-style:normal}
button,.btn{font-family:inherit;letter-spacing:.2px}label{font-weight:500}
.pc>small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pw.big{aspect-ratio:16/9}.p.big{font-size:26px;font-weight:800;color:var(--red2);margin-top:8px}
.desc{white-space:pre-wrap;color:#d8cccc;line-height:1.7;margin:10px 0 16px}
.pw{position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#1a0709}.pw img,.pw .ph{position:absolute;inset:0;width:100%;height:100%}.pw img{object-fit:cover}
.ph{display:grid;place-items:center;font-size:42px;font-weight:900;color:var(--red);background:linear-gradient(135deg,#1a0709,#2a0c0f)}
.pw.sm{width:120px;margin-bottom:6px}.pw.sm2{width:84px;flex:none;aspect-ratio:1}.dp2{display:flex;gap:12px;align-items:center}
.wbox{border:1px solid var(--line);border-radius:10px;padding:10px;background:#0a0405}
.srch{margin-bottom:10px}.cbar{margin-bottom:16px}.chips2{display:flex;gap:8px;flex-wrap:wrap}.chips2 button{padding:6px 14px;border-radius:20px;font-size:13px}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mu)}.meta span{border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:#0a0405}.pc .tag{align-self:flex-start}
.badge{display:inline-block;border:1px solid var(--red);border-radius:30px;padding:5px 16px;font-size:13px;color:var(--red2);background:#1a0709;margin-bottom:16px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}.stats div{border:1px solid var(--line);border-radius:12px;padding:12px 20px;background:#0e0708;min-width:150px}.stats b{display:block;font-family:Orbitron,sans-serif;color:var(--red2)}.stats small{color:var(--mu)}
.hero{position:relative}.hero::before{content:"";position:absolute;left:50%;top:0;width:460px;max-width:100%;height:240px;transform:translateX(-50%);background:radial-gradient(circle,#e1060055,transparent 70%);filter:blur(30px);z-index:-1}
.auth{background:linear-gradient(180deg,#160a0c,#0b0506)}
.btn{display:inline-block;text-align:center;text-decoration:none;font-weight:700;border-radius:8px;padding:10px 16px;color:#fff;background:linear-gradient(180deg,var(--red2),var(--red));box-shadow:0 0 14px #e1060055}
.dev{display:inline-flex;align-items:center;gap:8px;margin-top:6px;border:1px solid var(--red);border-radius:30px;padding:8px 18px;color:#fff;text-decoration:none;background:#1a0709;font-weight:700;font-size:13px}.dev:hover{box-shadow:0 0 18px #e1060066}
.usr{display:flex;align-items:center;gap:8px}.usr.big{margin-bottom:6px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--red2),#7a0300);display:grid;place-items:center;font-weight:800;flex:none}
.burger{display:none;padding:8px;background:#1a0709;border:1px solid var(--line);box-shadow:none}.burger svg{width:22px;height:22px;display:block}
.dw{position:fixed;inset:0;z-index:70;display:none}.dw.on{display:block}
.dov{position:absolute;inset:0;background:#000a}
.dp{position:absolute;top:0;right:0;bottom:0;width:min(300px,85vw);background:#0b0506;border-left:1px solid var(--red);padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px;display:flex;flex-direction:column;gap:10px;overflow:auto;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(100%)}}
.dn{display:flex;flex-direction:column;gap:8px}.dn button{text-align:left}
.ck{width:54px;height:54px;border-radius:50%;margin:0 auto 8px;background:#12803a;display:grid;place-items:center;font-size:28px;box-shadow:0 0 24px #12803a88}
.dprod{background:#1a0709;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.fld{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#000;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}.fv{font-family:monospace;word-break:break-all}
.pi.sm{width:120px;margin-bottom:6px}
@media(max-width:760px){.burger{display:grid}.out,.rc,.un,.tabs.nav{display:none}.top{padding:10px 12px}}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0a0405ee;backdrop-filter:blur(8px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#0a0405}
.card{transition:border-color .2s,box-shadow .2s,transform .2s;background:linear-gradient(180deg,#160a0c,#0e0708)}
.card:hover{border-color:var(--red);box-shadow:0 8px 28px #e1060033;transform:translateY(-2px)}
button{transition:transform .15s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px)}
.tabs button.ghost{background:#120a0b}
.box{animation:pop .18s ease}@keyframes pop{from{transform:scale(.96);opacity:0}}
.fab{position:fixed;right:12px;text-decoration:none;color:#fff;font-weight:700;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:40px;background:linear-gradient(135deg,#25d366,#128c4a);box-shadow:0 6px 22px #25d36655}
.fab svg{width:22px;height:22px;fill:#fff}
@media(max-width:560px){.fab span{display:none}.fab{padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<a class="fab" href="#" target="_blank" rel="noopener" onclick="wa(event,supMsg())" aria-label="Soporte por WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.1.1.3 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.7 1.2 1.5 1.9 1 .9 1.9 1.2 2.2 1.3.3.1.4.1.6-.1l.8-1c.2-.2.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg><span>Soporte</span></a>

<script>
/* ===== Capa de datos (localStorage). Para Firebase se reemplaza load()/save() y las operaciones ===== */
const K='ds_db';
const seed=()=>({users:[{id:'u0',email:'admin@digitalstore.com',pass:'admin123',role:'admin',balance:0}],products:[],recharges:[],orders:[],settings:{wa:'',pay:'Yape / Plin: 999 999 999\nTitular: Tu nombre',qr:''}});
const load=()=>{try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.users)return d}catch(e){}return seed()};
let db=load(),tab='catalog',authMode='login',view='home';
let me=null;
try{const s=sessionStorage.getItem('ds_me');if(s)me=db.users.find(u=>u.id===s)||null}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('No se pudo guardar los datos')}};
const uid=()=>Math.random().toString(36).slice(2,10);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RATE=3.40,MIN=1;
const PAY={yape:{n:'Yape',rows:[['Número','965730677'],['Nombre','Cristhian Eddy C. A.']],qr:'yaqr.jpeg',note:'Paga el equivalente en soles.'},bin:{n:'Binance Pay',rows:[['ID de usuario','1250169311'],['Nombre','CRB TECH SHP']],qr:'binqr.jpeg',note:'Paga el monto en dólares (USDT).'}};
let pm='yape',lastMsg='',cq='',cc='',aq='',sv='',mq='';
const mf=x=>!mq||[x.pname,x.cname,String(x.account).split('|')[0],cwa(x)].join(' ').toLowerCase().includes(mq.toLowerCase());
function cliEdit(id){const o=db.orders.find(x=>x.id===id);if(!o)return;modal(`<h3>Datos del cliente</h3><p class="mu">${esc(o.pname)}</p><label>Nombre del cliente</label><input id="cn2" maxlength="40" value="${esc(o.cname||'')}" placeholder="Nombre del cliente"><label>WhatsApp del cliente (opcional)</label><input id="cw2" inputmode="tel" value="${esc(o.cwa||'')}" placeholder="51999999999"><div class="two"><button onclick="saveCli('${id}')">Guardar</button><button class="ghost" onclick="closeM()">Cancelar</button></div>`)}
function saveCli(id){const o=db.orders.find(x=>x.id===id);let w=$('cw2').value.replace(/\D/g,'');if(w.length===9)w='51'+w;o.cname=$('cn2').value.trim();o.cwa=w;save();closeM();render();toast('Cliente actualizado')}
function prodM(id){const p=db.products.find(x=>x.id===id);if(!p)return;modal(`${pimg(p,'big')}<h2 style="font-size:20px;margin:14px 0 6px">${esc(p.name)}</h2>${p.cat?`<span class="tag">${esc(p.cat)}</span>`:''}<div class="p big">${money(p.price)}</div><div class="meta" style="margin:8px 0"><span>⏱ ${p.days||30} días</span><span>${p.ren?'Renovable':'No renovable'}</span><span>Stock ${p.stock.length}</span></div><p class="desc">${esc(p.desc)||'Sin descripción.'}</p><div class="two">${me&&me.role==='client'?`<button ${p.stock.length?'':'disabled'} onclick="closeM();buy('${p.id}')">${p.stock.length?'Comprar':'Agotado'}</button>`:''}<button class="ghost" onclick="closeM()">Cerrar</button></div>`)}
function editOrd(id){const o=db.orders.find(x=>x.id===id),p=String(o.account).split('|'),g=i=>esc((p[i]||'').trim());modal(`<h3>Editar entrega</h3><p class="mu">${esc(o.pname)}. El cliente verá los datos actualizados en su panel.</p><label>Correo</label><input id="e0" value="${g(0)}"><label>Contraseña</label><input id="e1" value="${g(1)}"><div class="two"><div><label>Perfil</label><input id="e2" value="${g(2)}"></div><div><label>PIN</label><input id="e3" value="${g(3)}"></div></div><div class="two"><button onclick="saveOrd('${id}')">Guardar cambios</button><button class="ghost" onclick="closeM()">Cancelar</button></div>`)}
function saveOrd(id){const o=db.orders.find(x=>x.id===id),v=[0,1,2,3].map(i=>$('e'+i).value.trim());if(!v[0]||!v[1])return toast('El correo y la contraseña son obligatorios');if(v.some(x=>x.includes('|')))return toast('No uses el símbolo | en los datos');o.account=v.join('|');o.edited=Date.now();save();closeM();render();toast('Entrega actualizada')}
const cwa=o=>o.cwa||'';
const accMsg=o=>{const p=String(o.account).split('|'),L=['Correo','Contraseña','Perfil','PIN'],f=p.length<2?['Cuenta: '+o.account]:L.map((l,i)=>(p[i]||'').trim()?l+': '+p[i].trim():'').filter(Boolean);return '*'+o.pname+'*\n'+f.join('\n')+(o.end?'\nVigencia: '+period(o)+' ('+(o.days||30)+' días, '+(o.ren?'renovable':'no renovable')+')':'')+'\n\n¡Gracias por tu compra en CBD STREAMING SHOP!'};
function copyTxt(t){try{navigator.clipboard.writeText(t).then(()=>toast('Copiado'),()=>toast('Selecciona y copia manualmente'))}catch(e){toast('Selecciona y copia manualmente')}}
function cpAll(id){copyTxt(accMsg(db.orders.find(x=>x.id===id)))}
function sendCli(e,id){const o=db.orders.find(x=>x.id===id);let n=($('wn').value||'').replace(/\D/g,'');if(n.length===9)n='51'+n;if(n.length<10){e.preventDefault();return toast('Escribe el WhatsApp del cliente con código de país')}e.currentTarget.href='https://wa.me/'+n+'?text='+encodeURIComponent(accMsg(o))}
const flt=()=>{const q=cq.toLowerCase();return db.products.filter(p=>(!cc||p.cat===cc)&&(!q||(p.name+' '+p.desc+' '+(p.cat||'')).toLowerCase().includes(q)))};
function refreshList(){$('clist').innerHTML=catalog2(flt())}
const catBar=()=>{const c=[...new Set(db.products.map(p=>p.cat).filter(Boolean))];return `<div class="cbar"><input class="srch" placeholder="Buscar producto…" value="${esc(cq)}" oninput="cq=this.value;refreshList()"><div class="chips2"><button class="${cc?'ghost':''}" onclick="cc='';render()">Todas</button>${c.map(x=>`<button class="${cc===x?'':'ghost'}" data-c="${esc(x)}" onclick="cc=this.dataset.c;render()">${esc(x)}</button>`).join('')}</div></div>`};
const catOpts=()=>[...new Set(db.products.map(p=>p.cat).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');
const pf=p=>!aq||(p.name+' '+(p.cat||'')+' '+p.desc).toLowerCase().includes(aq.toLowerCase());
const sf=x=>{if(!sv)return true;const u=db.users.find(u=>u.id===x.uid)||{};return [x.pname,u.name,u.email,String(x.account).split('|')[0]].join(' ').toLowerCase().includes(sv.toLowerCase())};
function sq(id,v){if(id==='aq')aq=v;else if(id==='mq')mq=v;else sv=v;render();const i=$(id);i.focus();i.setSelectionRange(v.length,v.length)}
const fd=t=>new Date(t).toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'});
const left=o=>Math.ceil((o.end-Date.now())/864e5);
const vig=o=>{if(!o.end)return '';const l=left(o);return l>0?`<span class="tag ok">Vigente · ${l} día${l===1?'':'s'}</span>`:'<span class="tag no">Vencido</span>'};
const period=o=>o.end?`Del ${fd(o.start)} al ${fd(o.end)}`:'';
const uname=u=>u.name||(u.role==='admin'?'Administrador':u.email.split('@')[0]);
const BURG='<button class="burger" onclick="tg()" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>';
const payHTML=k=>{const p=PAY[k];return `<div class="cred" style="white-space:normal">${p.rows.map((r,i)=>`<div class="fld" style="margin:0 0 6px"><div><small class="mu">${r[0]}</small><div class="fv">${r[1]}</div></div>${i===0?`<button class="ghost" onclick="copyTxt('${r[1]}')">Copiar</button>`:''}</div>`).join('')}</div><div class="qrb"><div class="qrph"><b>QR de ${p.n}</b><small>${p.qr}</small></div><img src="${p.qr}" alt="QR ${p.n}" onerror="this.remove()"></div><p class="mu" style="text-align:center">${p.note}</p>`};
function payM(k){pm=k;$('pinfo').innerHTML=payHTML(k);$('my').className=k==='yape'?'':'ghost';$('mb').className=k==='bin'?'':'ghost'}
const waLink=(m,w)=>{w=(w||db.settings.wa||'').replace(/\D/g,'');return w?'https://wa.me/'+w+'?text='+encodeURIComponent(m):''};

/* ===== Autenticación ===== */
function auth(){
  const email=$('em').value.trim().toLowerCase(),pass=$('pw').value;
  if(!email||pass.length<6)return toast('Ingresa un correo y una contraseña de 6 o más caracteres');
  if(authMode==='reg'){
    const nm=$('nm').value.trim();if(nm.length<2)return toast('Escribe tu nombre de usuario');
    if(db.users.some(u=>u.email===email))return toast('Ese correo ya está registrado');
    const u={id:uid(),name:nm,email,pass,role:'client',balance:0};db.users.push(u);save();me=u;
  }else{
    const u=db.users.find(u=>u.email===email&&u.pass===pass);
    if(!u)return toast('Correo o contraseña incorrectos');me=u;
  }
  try{sessionStorage.setItem('ds_me',me.id)}catch(e){}
  tab=me.role==='admin'?'pend':'catalog';render();
}
function logout(){me=null;view='home';try{sessionStorage.removeItem('ds_me')}catch(e){}render()}
function setMode(m){authMode=m;render()}
function go(m){authMode=m;view='auth';render();window.scrollTo(0,0)}


/* ===== Cliente ===== */
function buy(pid){
  fresh();const p=db.products.find(x=>x.id===pid);
  if(!p||!p.stock.length)return toast('Producto sin stock');
  if(me.balance<p.price)return toast('Saldo insuficiente. Recarga para continuar');
  modal(`<h3>Confirmar compra</h3>${pimg(p)}<p style="margin-top:10px">${esc(p.name)}<br><small class="mu">${p.days||30} días · ${p.ren?'Renovable':'No renovable'}</small><br><b>${money(p.price)}</b></p><label>Nombre del cliente (opcional, lo puedes agregar después en Mis compras)</label><input id="cn" maxlength="40" placeholder="Para quién es esta compra"><label>WhatsApp del cliente (opcional)</label><input id="cw" inputmode="tel" placeholder="51999999999"><div style="display:flex;gap:8px"><button onclick="confirmBuy('${pid}')">Comprar</button><button class="ghost" onclick="closeM()">Cancelar</button></div>`);
}
function confirmBuy(pid){
  const cn=$('cn').value.trim();let cw=$('cw').value.replace(/\D/g,'');if(cw.length===9)cw='51'+cw;
  fresh();const p=db.products.find(x=>x.id===pid);
  if(!p||!p.stock.length||me.balance<p.price){closeM();return toast('No se pudo completar la compra')}
  const acc=p.stock.shift();me.balance-=p.price;
  const o={id:uid(),uid:me.id,pname:p.name,account:acc,img:p.img||'',ren:!!p.ren,cname:cn,cwa:cw,price:p.price,days:p.days||30,start:Date.now(),end:Date.now()+(p.days||30)*864e5,date:new Date().toLocaleString('es-PE')};
  db.orders.unshift(o);save();render();showOrder(o.id);
}
function showOrder(id){
  const o=db.orders.find(x=>x.id===id);if(!o)return;
  modal(delivery(o));
}

function sendRecharge(){
  const a=parseFloat($('ra').value),r=$('rr').value.trim();

/* ===== Administrador ===== */
function addProduct(){
  const n=$('pn').value.trim(),d=$('pd').value.trim(),pr=parseFloat($('pp').value),im=$('pi').value.trim(),dy=parseInt($('pdays').value),cat=$('pc').value.trim(),rn=$('pr').value==='1';
  if(!n||!(pr>0))return toast('Escribe el nombre y un precio válido');
  db.products.push({id:uid(),name:n,desc:d,img:im,days:dy>0?dy:30,cat,ren:rn,price:pr,stock:[]});save();render();toast('Producto creado. Ahora sube su stock en la lista de abajo');
}
function addStock(pid){
  const all=$('st_'+pid).value.split('\n').map(x=>x.trim()).filter(Boolean);
  const t=all.filter(l=>{const q=l.split('|');return q.length===4&&q[0].trim()&&q[1].trim()});
  if(!all.length)return toast('Pega al menos una cuenta');
  if(t.length!==all.length)return toast('Formato inválido en '+(all.length-t.length)+' línea(s). Usa correo|contraseña|perfil|pin');
  db.products.find(p=>p.id===pid).stock.push(...t.map(l=>l.split('|').map(x=>x.trim()).join('|')));save();render();toast(t.length+' cuentas agregadas');
}
function delProduct(pid){if(confirm('¿Eliminar este producto y su stock?')){db.products=db.products.filter(p=>p.id!==pid);save();render()}}
function decide(id,ok){
  const r=db.recharges.find(x=>x.id===id);if(!r||r.status!=='pend')return;
  if(ok){const u=db.users.find(x=>x.id===r.uid);if(u)u.balance+=r.amount}
  r.status=ok?'ok':'no';save();render();toast(ok?'Recarga aprobada':'Recarga rechazada');
}
function saveSettings(){db.settings.wa=$('sw').value.trim();save();toast('Configuración guardada')}

function balM(id){const u=db.users.find(x=>x.id===id);modal(`<h3>Saldo del cliente</h3><p>${esc(u.email)}<br><b>Actual: ${money(u.balance)}</b></p><label>Monto (USD)</label><input id="bm" type="number" min="0" step="0.01"><div class="two"><button class="ok" onclick="setBal('${id}','add')">Agregar</button><button onclick="setBal('${id}','set')">Establecer saldo</button></div><button class="ghost" style="width:100%;margin-top:8px" onclick="closeM()">Cancelar</button>`)}
function setBal(id,m){const v=parseFloat($('bm').value);if(!(v>=0))return toast('Ingresa un monto válido');const u=db.users.find(x=>x.id===id);u.balance=m==='add'?u.balance+v:v;save();closeM();render();toast('Saldo actualizado')}
function sales(){const o=db.orders.filter(sf),em=id=>(db.users.find(u=>u.id===id)||{}).email||'—';return `<div class="sec"><h3>Historial de compras (${o.length})</h3><input id="sv" class="srch" placeholder="Buscar por correo, nombre o producto…" value="${esc(sv)}" oninput="sq('sv',this.value)"><p class="mu">Total vendido: <b>${money(o.reduce((s,x)=>s+x.price,0))}</b></p>${o.length?o.map(x=>`<div class="row"><span>${esc(x.pname)}<br><small class="mu">Comprador: ${esc(uname(db.users.find(u=>u.id===x.uid)||{email:'—'}))} · ${esc(em(x.uid))}<br>${esc(period(x)||x.date)}</small> ${vig(x)}</span><span style="display:flex;gap:6px;align-items:center"><b>${money(x.price)}</b><button class="ghost" onclick="showOrder('${x.id}')">Ver</button><button class="ghost" onclick="editOrd('${x.id}')">Editar</button></span></div>`).join(''):'<p class="mu">Todavía no hay ventas.</p>'}</div>`}
function editM(id){const p=db.products.find(x=>x.id===id);modal(`<h3>Editar producto</h3><label>Nombre</label><input id="en" value="${esc(p.name)}"><label>Precio (USD)</label><input id="ep" type="number" min="0" step="0.01" value="${p.price}"><label>Descripción</label><textarea id="ed" rows="4">${esc(p.desc)}</textarea><label>Categoría</label><input id="ec" list="cl2" value="${esc(p.cat||'')}"><datalist id="cl2">${catOpts()}</datalist><label>¿Renovable?</label><select id="er"><option value="1" ${p.ren?'selected':''}>Sí, renovable</option><option value="0" ${p.ren?'':'selected'}>No renovable</option></select><label>Duración (días)</label><input id="edy" type="number" min="1" value="${p.days||30}"><label>Link de la imagen</label><input id="ei" value="${esc(p.img||'')}"><div class="two"><button onclick="saveEdit('${id}')">Guardar cambios</button><button class="ghost" onclick="closeM()">Cancelar</button></div>`)}
function saveEdit(id){const p=db.products.find(x=>x.id===id),n=$('en').value.trim(),pr=parseFloat($('ep').value);if(!n||!(pr>0))return toast('El nombre y un precio válido son obligatorios');Object.assign(p,{name:n,price:pr,desc:$('ed').value.trim(),img:$('ei').value.trim(),days:parseInt($('edy').value)||30,cat:$('ec').value.trim(),ren:$('er').value==='1'});save();closeM();render();toast('Producto actualizado')}
function render(){
  const a=$('app');
  if(!me&&view==='home'){a.innerHTML=landing();return}
  if(!me){
    a.innerHTML=`<div class="auth"><div style="text-align:center">${LOGO}</div><h2 style="text-align:center;margin:16px 0 2px;font-size:20px">${authMode==='login'?'Bienvenido de vuelta':'Crea tu cuenta'}</h2><p class="mu" style="text-align:center;margin:0 0 4px">${authMode==='login'?'Ingresa para ver el catálogo y tus compras.':'Regístrate para comprar y recargar saldo.'}</p>
    <div class="tabs"><button class="${authMode==='login'?'':'ghost'}" onclick="setMode('login')">Ingresar</button><button class="${authMode==='reg'?'':'ghost'}" onclick="setMode('reg')">Registrarme</button></div>
    ${authMode==='reg'?'<label>Nombre de usuario</label><input id="nm" autocomplete="nickname" maxlength="24">':''}<label>Correo</label><input id="em" type="email" autocomplete="email"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')auth()">
    <button style="width:100%" onclick="auth()">${authMode==='login'?'Entrar':'Crear cuenta'}</button><button class="ghost" style="width:100%;margin-top:8px" onclick="view='home';render()">Volver al inicio</button>${authMode==='login'?'<p class="mu" style="font-size:12px;text-align:center">Demo admin: admin@digitalstore.com / admin123</p>':''}<div style="text-align:center;margin-top:10px"><a class="dev" href="${devLink()}" target="_blank" rel="noopener">Desarrollado por Impulso project</a></div></div>`;return;
  }
  fresh();const ad=me.role==='admin';
  const tabs=ad?[['pend','Recargas'],['prod','Productos'],['cli','Clientes'],['sales','Ventas'],['conf','Config'],['catalog','Catálogo']]:[['catalog','Catálogo'],['mine','Mis compras'],['rec','Mis recargas']];
  a.innerHTML=`<div class="top">${LOGO}<div class="r">
    ${ad?'':`<span class="bal">Saldo: ${money(me.balance)}</span><button class="rc" onclick="rechargeM()">Recargar</button>`}<span class="usr"><span class="av">${esc(uname(me)[0].toUpperCase())}</span><span class="un">${esc(uname(me))}</span></span><button class="ghost out" onclick="logout()">Salir</button>${BURG}</div></div>${drawer(tabs,ad)}
    <div class="wrap"><div class="tabs nav">${tabs.map(t=>`<button class="${tab===t[0]?'':'ghost'}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
    ${ad?adminView():tab==='mine'?mine():tab==='rec'?mine(1):catalog()}</div>`;
}
render();
</script>
</body>
</html>
